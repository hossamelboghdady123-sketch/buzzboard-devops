trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
- group: vg-devops-prod

stages:

- stage: Prerequisites
  displayName: '1 - Prerequisites'

  jobs:
  - job: InstallDependencies
    displayName: 'Install Dependencies'

    pool:
      vmImage: 'default'

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    - script: |
        set -e
        echo "Installing frontend dependencies..."
        cd "$(frontendPath)"
        npm ci
      displayName: 'Install Frontend Dependencies'

    - script: |
        set -e
        echo "Installing backend dependencies..."
        cd "$(backendPath)"
        npm ci
      displayName: 'Install Backend Dependencies'


- stage: TestAndLint
  displayName: '2 - Test and Lint'

  dependsOn:
    - Prerequisites

  condition: succeeded()

  jobs:

  - job: FrontendTest
    displayName: 'Frontend Test'

    pool:
      vmImage: 'default'

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    - script: |
        set -e
        cd "$(frontendPath)"
        npm ci
      displayName: 'Install Frontend Dependencies'

    - script: |
        set -e
        cd "$(frontendPath)"
        npm run lint
      displayName: 'Frontend Lint'

    - script: |
        cd "$(frontendPath)"

        if npm run | grep -q "test"; then
          npm test -- --run
        else
          echo "No frontend test script found."
        fi
      displayName: 'Frontend Tests'


  - job: BackendTest
    displayName: 'Backend Test'

    pool:
      vmImage: 'default'

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    - script: |
        set -e
        cd "$(backendPath)"
        npm ci
      displayName: 'Install Backend Dependencies'

    - script: |
        set -e
        cd "$(backendPath)"
        npm run lint
      displayName: 'Backend Lint'

    - script: |
        cd "$(backendPath)"

        if npm run | grep -q "test"; then
          npm test
        else
          echo "No backend test script found."
        fi
      displayName: 'Backend Tests'


- stage: BuildAndPush
  displayName: '3 - Build and Push Docker Images'

  dependsOn:
    - TestAndLint

  condition: succeeded()

  jobs:

  - job: BuildFrontend
    displayName: 'Build Frontend Docker Image'

    pool:
      vmImage: 'default'

    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Build and Push Frontend Image'

      inputs:
        command: 'buildAndPush'
        containerRegistry: 'DockerHubConnection'
        repository: '$(dockerUsername)/$(frontendImage)'
        dockerfile: '$(frontendPath)/Dockerfile'
        buildContext: '$(frontendPath)'
        tags: |
          $(Build.BuildId)
          latest


  - job: BuildBackend
    displayName: 'Build Backend Docker Image'

    pool:
      vmImage: 'default'

    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Build and Push Backend Image'

      inputs:
        command: 'buildAndPush'
        containerRegistry: 'DockerHubConnection'
        repository: '$(dockerUsername)/$(backendImage)'
        dockerfile: '$(backendPath)/Dockerfile'
        buildContext: '$(backendPath)'
        tags: |
          $(Build.BuildId)
          latest


- stage: DeployToKubernetes
  displayName: '4 - Deploy to Kubernetes'

  dependsOn:
    - BuildAndPush

  condition: succeeded()

  jobs:

  - deployment: DeployKubernetes
    displayName: 'Deploy Application to Kubernetes'

    environment: 'production'

    pool:
      vmImage: 'default'

    strategy:
      runOnce:
        deploy:

          steps:
          - checkout: self

          - task: KubernetesManifest@1
            displayName: 'Deploy Backend'

            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'KubernetesConnection'
              namespace: '$(k8sNamespace)'

              manifests: |
                kubernetes/backend/deployment.yaml
                kubernetes/backend/service.yaml

              containers: |
                $(dockerUsername)/$(backendImage):$(Build.BuildId)


          - task: KubernetesManifest@1
            displayName: 'Deploy Frontend'

            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'KubernetesConnection'
              namespace: '$(k8sNamespace)'

              manifests: |
                kubernetes/frontend/deployment.yaml
                kubernetes/frontend/service.yaml

              containers: |
                $(dockerUsername)/$(frontendImage):$(Build.BuildId)


          - script: |
              set -e

              echo "Checking Backend..."
              kubectl rollout status deployment/backend \
                --namespace "$(k8sNamespace)" \
                --timeout=180s

              echo "Checking Frontend..."
              kubectl rollout status deployment/frontend \
                --namespace "$(k8sNamespace)" \
                --timeout=180s

              echo "Kubernetes deployment completed."

              kubectl get pods \
                --namespace "$(k8sNamespace)"

              kubectl get services \
                --namespace "$(k8sNamespace)"

            displayName: 'Verify Kubernetes Deployment'


- stage: DeployToEC2
  displayName: '5 - Deploy to EC2'

  dependsOn:
    - DeployToKubernetes

  condition: succeeded()

  jobs:

  - job: DeployEC2
    displayName: 'Deploy Docker Containers to EC2'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - task: SSH@0
      displayName: 'Deploy Application to EC2'

      inputs:
        sshEndpoint: 'EC2-SSH-Connection'

        runOptions: 'inline'

        inline: |

          set -e

          echo "Pulling Frontend image..."

          docker pull \
            $(dockerUsername)/$(frontendImage):$(Build.BuildId)

          echo "Pulling Backend image..."

          docker pull \
            $(dockerUsername)/$(backendImage):$(Build.BuildId)

          echo "Stopping old containers..."

          docker stop frontend || true
          docker stop backend || true

          echo "Removing old containers..."

          docker rm frontend || true
          docker rm backend || true

          echo "Starting Backend..."

          docker run -d \
            --restart unless-stopped \
            --name backend \
            -p 5000:5000 \
            $(dockerUsername)/$(backendImage):$(Build.BuildId)

          echo "Starting Frontend..."

          docker run -d \
            --restart unless-stopped \
            --name frontend \
            -p 80:80 \
            $(dockerUsername)/$(frontendImage):$(Build.BuildId)

          echo "EC2 Deployment Completed."

          docker ps