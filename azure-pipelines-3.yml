trigger:
  branches:
    include:
      - main
      

pr:
  branches:
    include:
      - main
      

variables:

  dockerUsername: 'hossam1975'

  frontendImage: 'devops-job-board-frontend'
  backendImage: 'devops-job-board-backend'

  frontendPath: 'frontend'
  backendPath: 'backend'

  tag: '$(Build.BuildId)'

stages:

# ============================================================
# STAGE 1 - PREREQUISITES
# ============================================================

- stage: Prerequisites
  displayName: 'Prerequisites - Install Dependencies'
  jobs:

  - job: InstallDependencies
    displayName: 'Install Dependencies'
    pool:
      vmImage: 'default'

    steps:

    - checkout: self

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    - script: |
        echo "Installing frontend dependencies..."
        cd $(frontendPath)
        npm ci
      displayName: 'Install Frontend Dependencies'

    - script: |
        echo "Installing backend dependencies..."
        cd $(backendPath)
        npm ci
      displayName: 'Install Backend Dependencies'


# ============================================================
# STAGE 2 - TEST & LINT
# ============================================================

- stage: TestAndLint
  displayName: 'Test and Lint'
  dependsOn: Prerequisites
  condition: succeeded()

  jobs:

  # ---------------- FRONTEND ----------------

  - job: LintAndTestFrontend
    displayName: 'Lint and Test Frontend'
    pool:
      vmImage: 'default'

    steps:

    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd $(frontendPath)
        npm ci
      displayName: 'Install Frontend Dependencies'

    - script: |
        cd $(frontendPath)
        npm run lint
      displayName: 'Frontend Lint'

    - script: |
        cd $(frontendPath)

        if npm run | grep -q "test"; then
          npm test -- --run
        else
          echo "No frontend test script found."
        fi
      displayName: 'Frontend Tests'


  # ---------------- BACKEND ----------------

  - job: LintAndTestBackend
    displayName: 'Lint and Test Backend'
    pool:
      vmImage: 'default'

    steps:

    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        cd $(backendPath)
        npm ci
      displayName: 'Install Backend Dependencies'

    - script: |
        cd $(backendPath)
        npm run lint
      displayName: 'Backend Lint'

    - script: |
        cd $(backendPath)

        if npm run | grep -q "test"; then
          npm test
        else
          echo "No backend test script found."
        fi
      displayName: 'Backend Tests'


# ============================================================
# STAGE 3 - BUILD & PUSH DOCKER IMAGES
# ============================================================

- stage: BuildAndPush
  displayName: 'Build and Push Docker Images'
  dependsOn: TestAndLint
  condition: succeeded()

  jobs:

  # ---------------- FRONTEND IMAGE ----------------

  - job: BuildFrontend
    displayName: 'Build Frontend Docker Image'
    pool:
      vmImage: 'default'

    steps:

    - checkout: self

    - task: Docker@2
      displayName: 'Build Frontend Image'
      inputs:
        command: build
        repository: '$(dockerRegistry)/$(frontendImage)'
        dockerfile: '$(frontendPath)/Dockerfile'
        buildContext: '$(frontendPath)'
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: 'Push Frontend Image'
      inputs:
        command: push
        repository: '$(dockerRegistry)/$(frontendImage)'
        tags: |
          $(tag)
          latest
        containerRegistry: 'DockerRegistryConnection'


  # ---------------- BACKEND IMAGE ----------------

  - job: BuildBackend
    displayName: 'Build Backend Docker Image'
    pool:
      vmImage: 'default'

    steps:

    - checkout: self

    - task: Docker@2
      displayName: 'Build Backend Image'
      inputs:
        command: build
        repository: '$(dockerRegistry)/$(backendImage)'
        dockerfile: '$(backendPath)/Dockerfile'
        buildContext: '$(backendPath)'
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: 'Push Backend Image'
      inputs:
        command: push
        repository: '$(dockerRegistry)/$(backendImage)'
        tags: |
          $(tag)
          latest
        containerRegistry: 'DockerRegistryConnection'


# ============================================================
# STAGE 4 - DEPLOY TO KUBERNETES
# ============================================================

- stage: DeployToKubernetes
  displayName: 'Deploy to Kubernetes'
  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:

  - deployment: DeployKubernetes
    displayName: 'Deploy Application to Kubernetes'

    environment: 'production'

    pool:
      vmImage: 'default'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - task: KubernetesManifest@1
            displayName: 'Deploy Backend'
            inputs:
              action: deploy
              kubernetesServiceConnection: 'KubernetesConnection'
              namespace: 'default'
              manifests: |
                kubernetes/backend/deployment.yaml
                kubernetes/backend/service.yaml
              containers: |
                $(dockerRegistry)/$(backendImage):$(tag)

          - task: KubernetesManifest@1
            displayName: 'Deploy Frontend'
            inputs:
              action: deploy
              kubernetesServiceConnection: 'KubernetesConnection'
              namespace: 'default'
              manifests: |
                kubernetes/frontend/deployment.yaml
                kubernetes/frontend/service.yaml
              containers: |
                $(dockerRegistry)/$(frontendImage):$(tag)

          - script: |
              echo "Waiting for Kubernetes deployment..."

              kubectl rollout status deployment/backend \
                --namespace default \
                --timeout=180s

              kubectl rollout status deployment/frontend \
                --namespace default \
                --timeout=180s

              echo "Deployment completed successfully!"
            displayName: 'Verify Kubernetes Deployment'


# ============================================================
# STAGE 5 - DEPLOY TO EC2
# ============================================================

- stage: DeployToEC2
  displayName: 'Deploy to EC2 - Docker'
  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:

  - job: DeployEC2
    displayName: 'Deploy Docker Containers to EC2'
    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - task: SSH@0
      displayName: 'Deploy Application to EC2'
      inputs:
        sshEndpoint: 'EC2-SSH-Connection'
        runOptions: inline
        inline: |

          echo "Pulling latest images..."

          docker pull $(dockerRegistry)/$(frontendImage):$(tag)
          docker pull $(dockerRegistry)/$(backendImage):$(tag)

          echo "Stopping old containers..."

          docker stop frontend || true
          docker stop backend || true

          docker rm frontend || true
          docker rm backend || true

          echo "Starting Backend..."

          docker run -d \
            --name backend \
            -p 5000:5000 \
            $(dockerRegistry)/$(backendImage):$(tag)

          echo "Starting Frontend..."

          docker run -d \
            --name frontend \
            -p 80:80 \
            $(dockerRegistry)/$(frontendImage):$(tag)

          echo "EC2 deployment completed!"